<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS2 Boot Screen</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; height: 100%; }
  #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #titleBlock {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; font-family: 'Segoe UI', sans-serif; opacity: 0;
    transition: opacity 1.1s ease-out;
  }
  #titleBlock.show { opacity: 1; }
  #titleBlock .name {
    font-size: 34px; font-weight: 300; letter-spacing: 10px; color: #e8edf5;
    text-shadow: 0 0 18px rgba(140, 180, 255, 0.35);
  }
  #titleBlock .tag {
    font-size: 12px; letter-spacing: 3px; color: #7d8698; margin-top: 12px;
  }
  #blackout {
    position: absolute; inset: 0; background: #000000; opacity: 0;
    transition: opacity 0.7s ease-in; pointer-events: none;
  }
  #blackout.show { opacity: 1; }
  #flash {
    position: absolute; inset: 0; background: #eaf2ff; opacity: 0;
    transition: opacity 0.09s ease-out; pointer-events: none;
  }
  #flash.show { opacity: 0.55; transition: opacity 0.03s ease-out; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="flash"></div>
<div id="blackout"></div>
<div id="titleBlock">
  <div class="name">PCSX2 MANAGER</div>
  <div class="tag">CHEATS&nbsp;&nbsp;&middot;&nbsp;&nbsp;TEXTURES&nbsp;&nbsp;&middot;&nbsp;&nbsp;SETTINGS</div>
</div>

<script src="qwebchannel.js"></script>
<script>
  window.bridge = null;
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.bridge = channel.objects.bridge;
    });
  }
</script>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { InputManager } from './input.js';

// A splash sequence matched against a real reference frame of the PS2 boot:
// chunky pale blocks tumbling at all angles, scattered around a glowing blue
// nebula in black space, tiny colored light streaks drifting by, and the
// camera pushing slowly through the field into the glow -- then black, and
// the title revealed in time with the music. This app's own name and an
// original AI-composed startup sound, not Sony's copyrighted logo/animation/
// audio.

// Deterministic pseudo-random so the composition is identical every boot.
function prand(i) {
  const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0007);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 4000);
const CAMERA_START_Z = 850;
const CAMERA_END_Z = -150;
camera.position.set(0, 0, CAMERA_START_Z);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.getElementById('scene').appendChild(renderer.domElement);

// Three.js r155+ uses physically-based light intensities by default.
scene.add(new THREE.AmbientLight(0xc8d2e0, 4.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 4.2);
dirLight.position.set(0.5, 1, 0.7);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x6f8fd0, 1.4);
fillLight.position.set(-0.7, -0.4, 0.4);
scene.add(fillLight);

// ---- Mottled block surface ----
// The reference blocks aren't flat-shaded plastic -- they have a weathered,
// mottled gray surface. A noise-speckled canvas texture sells that cheaply.
function makeBlockTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#d3d8df';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 420; i++) {
    const shade = 175 + Math.floor(prand(i + 3000) * 70);
    ctx.fillStyle = 'rgba(' + shade + ',' + (shade + 3) + ',' + (shade + 8) + ',' +
                    (0.25 + prand(i + 3500) * 0.4).toFixed(2) + ')';
    const s = 2 + prand(i + 4000) * 9;
    ctx.fillRect(prand(i + 4500) * size, prand(i + 5000) * size, s, s);
  }
  const tex = new THREE.CanvasTexture(canvas);
  // Canvas pixels are sRGB -- without tagging them as such, Three treats
  // them as linear and the pale gray renders visibly darker than drawn.
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const blockTex = makeBlockTexture();

// ---- The block field ----
// Chunky, near-cubic blocks (matching the reference's proportions) scattered
// all around the frame -- above, below, beside the center -- each frozen at
// its own random 3D tilt and tumbling very slowly.
const blocks = [];
for (let i = 0; i < 42; i++) {
  const base = 34 + prand(i) * 34;
  const w = base * (0.8 + prand(i + 100) * 0.6);
  const h = base * (0.8 + prand(i + 200) * 0.9);
  const d = base * (0.8 + prand(i + 300) * 0.6);
  const mat = new THREE.MeshStandardMaterial({
    map: blockTex, color: 0xffffff, metalness: 0.05, roughness: 0.75,
    transparent: true, opacity: 0,
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

  // Scatter in a loose cylinder around the camera path, leaving only a
  // narrow clear core so blocks fill the frame at every depth.
  const ang = prand(i + 400) * Math.PI * 2;
  const rad = 70 + prand(i + 500) * 330;
  mesh.position.set(
    Math.cos(ang) * rad,
    Math.sin(ang) * rad * 0.75,
    CAMERA_START_Z - 120 - prand(i + 600) * (CAMERA_START_Z - CAMERA_END_Z + 550)
  );
  mesh.rotation.set(prand(i + 700) * Math.PI, prand(i + 800) * Math.PI, prand(i + 900) * Math.PI);
  mesh.userData.tumble = new THREE.Vector3(
    (prand(i + 1000) - 0.5) * 0.0035,
    (prand(i + 1100) - 0.5) * 0.0035,
    (prand(i + 1200) - 0.5) * 0.002
  );
  scene.add(mesh);
  blocks.push(mesh);
}

// ---- Central blue nebula ----
function makeGlowTexture(inner, mid) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grd = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0, inner);
  grd.addColorStop(0.4, mid);
  grd.addColorStop(1, 'rgba(20,40,90,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const nebulaTexBright = makeGlowTexture('rgba(140,180,255,0.9)', 'rgba(60,100,200,0.5)');
const nebulaTexSoft = makeGlowTexture('rgba(70,110,210,0.55)', 'rgba(35,60,140,0.3)');

const nebulaSprites = [];
const nebulaSpecs = [
  { tex: nebulaTexSoft,   scale: 950, x: 0,    y: 20,  z: -420, op: 0.85 },
  { tex: nebulaTexBright, scale: 560, x: -40,  y: 0,   z: -380, op: 1.0 },
  { tex: nebulaTexSoft,   scale: 700, x: 90,   y: -60, z: -300, op: 0.6 },
  { tex: nebulaTexBright, scale: 340, x: 30,   y: 50,  z: -260, op: 0.8 },
];
nebulaSpecs.forEach((spec, i) => {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: spec.tex, transparent: true, opacity: spec.op,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  spr.scale.set(spec.scale, spec.scale, 1);
  spr.position.set(spec.x, spec.y, spec.z);
  scene.add(spr);
  nebulaSprites.push({ spr, baseOp: spec.op, phase: i * 1.7 });
});

// ---- Drifting light specks + a few colored streaks ----
const speckCount = 220;
const speckPositions = new Float32Array(speckCount * 3);
for (let i = 0; i < speckCount; i++) {
  speckPositions[i * 3] = (prand(i + 900) - 0.5) * 1100;
  speckPositions[i * 3 + 1] = (prand(i + 1000) - 0.5) * 620;
  speckPositions[i * 3 + 2] = CAMERA_START_Z - prand(i + 1100) * (CAMERA_START_Z - CAMERA_END_Z + 650);
}
const speckGeo = new THREE.BufferGeometry();
speckGeo.setAttribute('position', new THREE.BufferAttribute(speckPositions, 3));
scene.add(new THREE.Points(speckGeo, new THREE.PointsMaterial({
  color: 0x9fc8ff, size: 3.2, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
})));

const streakTex = makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0.4)');
const streakColors = [0x37d67a, 0xd65454, 0x5ec8ff, 0x37d67a, 0xd0b04a, 0x5ec8ff];
const streaks = [];
streakColors.forEach((color, i) => {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: streakTex, color, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  spr.scale.set(9, 9, 1);
  spr.position.set(
    (prand(i + 2000) - 0.5) * 700,
    (prand(i + 2100) - 0.5) * 400,
    CAMERA_START_Z - 300 - prand(i + 2200) * 800
  );
  spr.userData.vel = new THREE.Vector3(
    (prand(i + 2300) - 0.5) * 1.4,
    (prand(i + 2400) - 0.5) * 1.0,
    (prand(i + 2500) - 0.5) * 0.6
  );
  scene.add(spr);
  streaks.push(spr);
});

// Fade the world in from black
let fadeStart = null;
function fadeIn(ts) {
  if (!fadeStart) fadeStart = ts;
  const t = Math.min(1, (ts - fadeStart) / 1200);
  blocks.forEach((m) => { m.material.opacity = t; });
  if (t < 1) requestAnimationFrame(fadeIn);
}
requestAnimationFrame(fadeIn);

// ---- Camera flythrough, cued to the audio ----
// The flight is stretched to fill the audio up to the blackout moment (set
// once the track's real duration is known), so the whole sequence -- drift,
// push into the nebula, cut to black, title -- lands on the music's timing
// rather than an arbitrary fixed timer.
let FLIGHT_MS = 5200;           // fallback if audio metadata never arrives
let audioCued = false;          // true once blackout/title are audio-scheduled
const BLACKOUT_BEFORE_END_S = 4.0;
const TITLE_BEFORE_END_S = 3.2;

let flashedOnce = false;
function showBlackout() {
  document.getElementById('blackout').classList.add('show');
  // A quick bright pulse right on the cut gives the transition more punch,
  // like the impact-flash many game intros use going into black.
  if (!flashedOnce) {
    flashedOnce = true;
    const flashEl = document.getElementById('flash');
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 90);
  }
}
function showTitle() { document.getElementById('titleBlock').classList.add('show'); }

let flightStart = null;
function flyCamera(ts) {
  if (!flightStart) flightStart = ts;
  const t = Math.min(1, (ts - flightStart) / FLIGHT_MS);
  const eased = t * t * (3 - 2 * t);
  camera.position.z = CAMERA_START_Z + (CAMERA_END_Z - CAMERA_START_Z) * eased;
  const sway = ts / 1000;
  camera.position.x = Math.sin(sway * 0.6) * 24;
  camera.position.y = Math.sin(sway * 0.4) * 13;
  camera.lookAt(0, 0, camera.position.z - 400);
  // A faint roll on top of the look-at gives the drift a less mechanical,
  // more hand-held feel -- eases in/out with the flight rather than the raw
  // sway so it never feels sudden.
  camera.rotation.z = Math.sin(sway * 0.35) * 0.032 * Math.sin(eased * Math.PI);
  // Subtle FOV push tightens the frame as the flight nears its end, adding
  // a gentle sense of acceleration into the nebula.
  camera.fov = 58 - eased * 4;
  camera.updateProjectionMatrix();
  if (t < 1) {
    requestAnimationFrame(flyCamera);
  } else if (!audioCued) {
    // No usable audio timing -- fall back to revealing at flight end.
    showBlackout();
    setTimeout(showTitle, 700);
  }
}
requestAnimationFrame(flyCamera);

// ---- Original startup sound (AI-composed, PS2-inspired -- not Sony's audio) ----
const bootAudio = new Audio(encodeURI('PCSX2 Manager startup.mp3'));
bootAudio.volume = 0.8;

// ---- Real-time audio-reactive visuals ----
let analyser = null;
let audioDataArray = null;
function setupAudioAnalyser() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(bootAudio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.75;
    // Must reconnect to destination or the element's playback goes silent.
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioDataArray = new Uint8Array(analyser.frequencyBinCount);
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {
    analyser = null;
  }
}
setupAudioAnalyser();

let bassEnergy = 0;
let overallEnergy = 0;
function sampleAudioEnergy() {
  if (!analyser || !audioDataArray) return;
  analyser.getByteFrequencyData(audioDataArray);
  const bassBins = Math.min(6, audioDataArray.length);
  let bassSum = 0;
  for (let i = 0; i < bassBins; i++) bassSum += audioDataArray[i];
  const bassRaw = bassSum / (bassBins * 255);
  let allSum = 0;
  for (let i = 0; i < audioDataArray.length; i++) allSum += audioDataArray[i];
  const overallRaw = allSum / (audioDataArray.length * 255);
  bassEnergy += (bassRaw - bassEnergy) * 0.35;
  overallEnergy += (overallRaw - overallEnergy) * 0.25;
}

let finished = false;
function finish() {
  if (finished) return;
  finished = true;
  try { bootAudio.pause(); } catch (e) { /* ignore */ }
  if (window.bridge && window.bridge.notifyFinished) window.bridge.notifyFinished();
  else console.log('boot finished');
}

window.addEventListener('click', finish);
window.addEventListener('keydown', finish);

// Any controller button skips too, same as a key press or click.
const input = new InputManager();
window.__input = input; // debug/verification handle only
input.onConfirm(finish);
input.onBack(finish);

// PlaybackRequiresUserGesture is disabled on the Python side for this widget
// (see ps2_ui.BootScreenWidget), so autoplay-with-sound should succeed.
bootAudio.play().catch(() => { /* blocked -- animation still plays silently */ });

bootAudio.addEventListener('ended', finish);
bootAudio.addEventListener('loadedmetadata', () => {
  if (isFinite(bootAudio.duration) && bootAudio.duration > 6) {
    audioCued = true;
    // Stretch the flight so it lands right as the screen cuts to black.
    FLIGHT_MS = (bootAudio.duration - BLACKOUT_BEFORE_END_S) * 1000;
  }
  const durationMs = isFinite(bootAudio.duration) ? bootAudio.duration * 1000 : 2600;
  setTimeout(finish, durationMs + 400);
});
// Blackout/title keyed to actual playback position, not wall-clock guesses.
bootAudio.addEventListener('timeupdate', () => {
  if (!audioCued || !isFinite(bootAudio.duration)) return;
  const remaining = bootAudio.duration - bootAudio.currentTime;
  if (remaining <= BLACKOUT_BEFORE_END_S) showBlackout();
  if (remaining <= TITLE_BEFORE_END_S) showTitle();
});
setTimeout(finish, 25000);

function animate(ts) {
  requestAnimationFrame(animate);
  sampleAudioEnergy();
  const t = (ts || 0) / 1000;

  // Blocks tumble slowly and breathe slightly with the bass.
  const pulse = 1 + bassEnergy * 0.12;
  blocks.forEach((m) => {
    m.rotation.x += m.userData.tumble.x * (1 + overallEnergy * 1.5);
    m.rotation.y += m.userData.tumble.y * (1 + overallEnergy * 1.5);
    m.rotation.z += m.userData.tumble.z;
    m.scale.setScalar(pulse);
  });

  // The nebula swells with the music.
  nebulaSprites.forEach(({ spr, baseOp, phase }) => {
    spr.material.opacity = baseOp + Math.sin(t * 0.5 + phase) * 0.07 + overallEnergy * 0.3;
  });

  // Colored streaks drift.
  streaks.forEach((spr) => { spr.position.add(spr.userData.vel); });

  dirLight.intensity = 2.6 + bassEnergy * 2.2;
  fillLight.intensity = 1.0 + overallEnergy * 1.6;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Debug/verification handle -- lets automated checks confirm geometry is
// actually drawn without affecting the page's behavior.
window.__bootDebug = { renderer, camera, blockCount: blocks.length };
</script>
</body>
</html>
