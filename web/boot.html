<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PCSX2 Manager</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; height: 100%; }
  #titleBlock {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; font-family: 'Segoe UI', sans-serif; opacity: 0;
    transition: opacity 1.1s ease-out;
  }
  #titleBlock.show { opacity: 1; }
  #titleBlock .name {
    font-size: 34px; font-weight: 300; letter-spacing: 10px; color: #e8edf5;
    text-shadow: 0 0 18px rgba(140, 180, 255, 0.35);
  }
  #titleBlock .tag {
    font-size: 12px; letter-spacing: 3px; color: #7d8698; margin-top: 12px;
  }
</style>
</head>
<body>
<div id="titleBlock">
  <div class="name">PCSX2 MANAGER</div>
  <div class="tag">CHEATS&nbsp;&nbsp;&middot;&nbsp;&nbsp;TEXTURES&nbsp;&nbsp;&middot;&nbsp;&nbsp;SETTINGS</div>
</div>

<script src="qwebchannel.js"></script>
<script>
  window.bridge = null;
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.bridge = channel.objects.bridge;
    });
  }
</script>
<script type="module">
import { InputManager } from './input.js';

// A plain title splash: this app's own name, faded in, then straight through
// to the ring menu -- no animation, no audio.
requestAnimationFrame(() => {
  document.getElementById('titleBlock').classList.add('show');
});

let finished = false;
function finish() {
  if (finished) return;
  finished = true;
  if (window.bridge && window.bridge.notifyFinished) window.bridge.notifyFinished();
  else console.log('boot finished');
}

window.addEventListener('click', finish);
window.addEventListener('keydown', finish);

const input = new InputManager();
window.__input = input; // debug/verification handle only
input.onConfirm(finish);
input.onBack(finish);

// Auto-advance a couple seconds after the title is fully visible, same as
// pressing a key -- long enough to read, short enough not to be a chore.
setTimeout(finish, 2600);
</script>
</body>
</html>
