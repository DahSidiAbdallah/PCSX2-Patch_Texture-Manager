<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS2 Game Carousel</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    /* The PS2 Browser screen's silvery mist -- a soft radial wash of light
       gray, brightest just above center, darkening toward the edges. */
    background: radial-gradient(circle at 50% 40%, #c9ced6 0%, #a2a8b2 52%, #757b86 100%);
  }
  #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #header {
    position: absolute; top: 20px; left: 26px;
    font-family: 'Segoe UI', sans-serif; color: #f4f7fb;
    text-shadow: 0 1px 3px rgba(30, 36, 48, 0.65);
  }
  #header .h-title { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  #header .h-sub { font-size: 12px; margin-top: 2px; opacity: 0.85; }
  #prompt {
    position: absolute; bottom: 24px; width: 100%; text-align: center;
    font-family: 'Segoe UI', sans-serif; color: #eef1f6; font-size: 13px;
    letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(30, 36, 48, 0.65);
  }
  /* Generic colored-badge convention for controller face buttons (A/B/X/Y) --
     not a reproduction of any manufacturer's button artwork/logo. */
  .xb-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 50%; font-size: 11px; font-weight: 700;
    color: #fff; vertical-align: -3px; margin: 0 2px;
    text-shadow: none;
  }
  .xb-a { background: #1c8a2e; }
  .xb-b { background: #d5222b; }
  .xb-y { background: #d0b02a; }
  /* A small D-pad cross (generic controller convention, not any specific
     manufacturer's artwork) shown in gamepad mode instead of text arrows. */
  .dpad-icon { position: relative; display: inline-block; width: 20px; height: 20px; vertical-align: -6px; margin: 0 4px; }
  .dpad-icon .bar {
    position: absolute; background: #262b36; border: 1px solid #5a6478; border-radius: 2px;
  }
  .dpad-icon .bar.h { left: 0; top: 7px; width: 20px; height: 6px; }
  .dpad-icon .bar.v { left: 7px; top: 0; width: 6px; height: 20px; }
  /* Small physical-keycap look for keyboard mode, replacing plain glyphs --
     used for every keyboard-mode prompt (never a PS2/Xbox controller glyph). */
  .key-cap {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 4px; margin: 0 1px; vertical-align: -4px;
    border-radius: 3px; font-size: 11px; font-weight: 700;
    background: linear-gradient(180deg, #3a4256, #262c3b);
    border: 1px solid #4a5468; border-bottom: 2px solid #171b24;
    color: #e8edf5; text-shadow: none;
  }
  #empty {
    position: absolute; top: 50%; width: 100%; text-align: center; transform: translateY(-50%);
    font-family: 'Segoe UI', sans-serif; color: #f4f7fb; font-size: 16px; display: none;
    text-shadow: 0 1px 3px rgba(30, 36, 48, 0.65);
  }
  #backBtn, #viewToggleBtn {
    position: absolute; top: 18px;
    font-family: 'Segoe UI', sans-serif; font-size: 13px; color: #eef1f6;
    background: rgba(24, 30, 42, 0.5); border: 1px solid rgba(238, 241, 246, 0.35);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; user-select: none;
    text-shadow: 0 1px 2px rgba(30, 36, 48, 0.6);
  }
  #backBtn { right: 22px; }
  #viewToggleBtn { right: 118px; }
  #backBtn:hover, #viewToggleBtn:hover { background: rgba(24, 30, 42, 0.72); border-color: #eef1f6; }
  #zoomControl {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px;
    font-family: 'Segoe UI', sans-serif; font-size: 12px; color: #eef1f6;
    background: rgba(24, 30, 42, 0.45); border: 1px solid rgba(238, 241, 246, 0.3);
    border-radius: 8px; padding: 6px 12px;
    text-shadow: 0 1px 2px rgba(30, 36, 48, 0.6);
  }
  #zoomControl input[type="range"] { width: 120px; }
  #zoomLabel { min-width: 34px; text-align: right; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="header">
  <div class="h-title">Game Library</div>
  <div class="h-sub" id="headerCount"></div>
</div>
<div id="backBtn"></div>
<div id="viewToggleBtn">&#8862; Grid</div>
<div id="zoomControl">
  <span>Zoom</span>
  <input type="range" id="zoomSlider" min="0.6" max="1.6" step="0.1" value="1">
  <span id="zoomLabel">100%</span>
</div>
<div id="empty">Scan a folder or add a game to get started.</div>
<div id="prompt"><span id="promptInstall"></span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="promptBack"></span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="promptNavigate"></span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="promptRemove"></span></div>

<script src="qwebchannel.js"></script>
<script>
  window.bridge = null;
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.bridge = channel.objects.bridge;
    });
  }
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { InputManager } from './input.js';

// The PS2 "Browser screen" adapted to games: floating cover tiles hovering
// in a silvery mist (transparent WebGL canvas over the CSS gradient behind
// it), bobbing gently in place like the Browser's floating save icons.
// Two view modes share the same tile objects: 'carousel' (swipe through one
// row, PS2-Browser-faithful) and 'grid' (multi-row, up/down moves rows,
// zoom controls how many columns are visible -- closer to a modern emulator
// front-end's game grid).

let games = [];
let currentIndex = 0;
let tiles = [];
let viewMode = 'carousel'; // 'carousel' | 'grid'
let zoomLevel = 1.0; // 0.6 (more, smaller tiles) .. 1.6 (fewer, bigger tiles)

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 15, 480);

// Alpha so the CSS silvery-mist gradient shows through as the backdrop.
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
dirLight.position.set(-1, 1, 1);
scene.add(dirLight);

const textureLoader = new THREE.TextureLoader();

// Placeholder "cover" (canvas with the title baked on) used when a game has
// no cover image yet -- real covers load from disk via coverSource.
function placeholderTexture(game) {
  const w = 256, h = 341;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1b3160';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#3f6ac4';
  ctx.lineWidth = 3;
  ctx.strokeRect(4, 4, w - 8, h - 8);
  ctx.fillStyle = '#eaf2ff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  wrapText(ctx, game.title || game.serial, w / 2, h / 2, w - 30, 24);
  return new THREE.CanvasTexture(canvas);
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (const word of words) {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word + ' '; }
    else line = test;
  }
  lines.push(line);
  const startY = y - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l.trim(), x, startY + i * lineHeight));
}

// Soft shadow blob under each floating tile, grounding it in the mist.
function makeShadowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size / 2;
  const ctx = canvas.getContext('2d');
  const grd = ctx.createRadialGradient(size/2, size/4, 0, size/2, size/4, size/2);
  grd.addColorStop(0, 'rgba(30, 36, 48, 0.45)');
  grd.addColorStop(1, 'rgba(30, 36, 48, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, size, size / 2);
  return new THREE.CanvasTexture(canvas);
}
const shadowTex = makeShadowTexture();

const planeGeo = new THREE.PlaneGeometry(140, 187);

function clearTiles() {
  tiles.forEach(({ mesh, shadow }) => { scene.remove(mesh); scene.remove(shadow); });
  tiles = [];
}

function buildTiles() {
  clearTiles();
  games.forEach((game, i) => {
    const mat = new THREE.MeshStandardMaterial({ map: placeholderTexture(game), transparent: true });
    const mesh = new THREE.Mesh(planeGeo, mat);
    scene.add(mesh);

    const shadow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: shadowTex, transparent: true, opacity: 0.6, depthWrite: false,
    }));
    shadow.scale.set(130, 34, 1);
    scene.add(shadow);

    tiles.push({ mesh, shadow, bobPhase: i * 0.9 });
    if (game.coverSource) {
      textureLoader.load(game.coverSource, (tex) => { mat.map = tex; mat.needsUpdate = true; });
    }
  });
  layoutCurrent(true);
  updateInfo();
  document.getElementById('empty').style.display = games.length === 0 ? 'block' : 'none';
  document.getElementById('headerCount').textContent =
    games.length ? (games.length + ' game' + (games.length === 1 ? '' : 's')) : '';
}

function layoutCurrent(snap) {
  if (viewMode === 'grid') layoutGrid(snap);
  else layoutCarousel(snap);
}

function layoutCarousel(snap) {
  tiles.forEach(({ mesh, shadow }, i) => {
    const delta = i - currentIndex;
    mesh.userData.targetX = delta * 150;
    mesh.userData.targetY = 0;
    mesh.userData.targetZ = -Math.abs(delta) * 90;
    mesh.userData.targetScale = delta === 0 ? 1.0 : Math.max(0.55, 1.0 - Math.abs(delta) * 0.16);
    mesh.userData.targetRotY = delta * 0.35;
    mesh.userData.targetOpacity = Math.max(0.25, 1.0 - Math.abs(delta) * 0.22);
    mesh.userData.shadowOffsetY = -118;
    if (snap) {
      mesh.position.set(mesh.userData.targetX, mesh.userData.targetY, mesh.userData.targetZ);
      mesh.scale.setScalar(mesh.userData.targetScale);
      mesh.rotation.y = mesh.userData.targetRotY;
      mesh.material.opacity = mesh.userData.targetOpacity;
      shadow.position.set(mesh.userData.targetX, mesh.userData.targetY + mesh.userData.shadowOffsetY, mesh.userData.targetZ);
    }
  });
}

// Zoom sets how many columns are visible -- fewer columns means bigger tiles,
// more columns means more of the library visible at once.
function gridCols() {
  return Math.max(3, Math.min(8, Math.round(6 / zoomLevel)));
}

function layoutGrid(snap) {
  const cols = gridCols();
  const spacingX = 150 * zoomLevel;
  const spacingY = 196 * zoomLevel;
  const selCol = currentIndex % cols;
  const selRow = Math.floor(currentIndex / cols);
  tiles.forEach(({ mesh, shadow }, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const dCol = col - selCol;
    const dRow = row - selRow;
    const dist = Math.abs(dRow) + Math.abs(dCol) * 0.5;
    mesh.userData.targetX = dCol * spacingX;
    mesh.userData.targetY = -dRow * spacingY;
    mesh.userData.targetZ = -Math.abs(dRow) * 14;
    mesh.userData.targetScale = (i === currentIndex ? 1.12 : 0.92) * zoomLevel;
    mesh.userData.targetRotY = 0;
    mesh.userData.targetOpacity = Math.max(0, 1.0 - dist * 0.16);
    mesh.userData.shadowOffsetY = -96 * zoomLevel;
    if (snap) {
      mesh.position.set(mesh.userData.targetX, mesh.userData.targetY, mesh.userData.targetZ);
      mesh.scale.setScalar(mesh.userData.targetScale);
      mesh.rotation.y = 0;
      mesh.material.opacity = mesh.userData.targetOpacity;
      shadow.position.set(mesh.userData.targetX, mesh.userData.targetY + mesh.userData.shadowOffsetY, mesh.userData.targetZ);
    }
  });
}

function updateInfo() {
  // Title/serial/status used to render as a text overlay here, but it sat at
  // a fixed position tuned for the single-row carousel and overlapped tiles
  // once grid mode added multiple rows -- and the native panel below the
  // 3D view already shows the same cheats/textures status persistently, so
  // rather than re-tune the overlay's position this just notifies Python
  // (which drives that native panel) without duplicating it in-scene.
  notifySelection();
}

function notifySelection() {
  if (games.length === 0) return;
  if (window.bridge && window.bridge.notifySelectionChanged) {
    window.bridge.notifySelectionChanged(games[currentIndex].serial);
  }
}

function moveLeft() { if (!games.length) return; currentIndex = (currentIndex - 1 + games.length) % games.length; layoutCurrent(); updateInfo(); }
function moveRight() { if (!games.length) return; currentIndex = (currentIndex + 1) % games.length; layoutCurrent(); updateInfo(); }
function moveUp() {
  if (!games.length || viewMode !== 'grid') return;
  const cols = gridCols();
  if (currentIndex - cols < 0) return;
  currentIndex -= cols;
  layoutCurrent(); updateInfo();
}
function moveDown() {
  if (!games.length || viewMode !== 'grid') return;
  const cols = gridCols();
  if (currentIndex + cols >= games.length) return;
  currentIndex += cols;
  layoutCurrent(); updateInfo();
}
function activate() {
  if (!games.length) return;
  const serial = games[currentIndex].serial;
  if (window.bridge && window.bridge.notifyActivated) window.bridge.notifyActivated(serial);
}
function removeCurrent() {
  if (!games.length) return;
  const serial = games[currentIndex].serial;
  if (window.bridge && window.bridge.notifyRemoveRequested) window.bridge.notifyRemoveRequested(serial);
}
function goBack() {
  if (window.bridge && window.bridge.notifyBackRequested) window.bridge.notifyBackRequested();
}
document.getElementById('backBtn').addEventListener('click', (e) => {
  e.stopPropagation(); // don't also trigger the scene click zones
  goBack();
});

// ---- View mode + zoom ----
function setZoom(z) {
  zoomLevel = Math.max(0.6, Math.min(1.6, Math.round(z * 20) / 20));
  document.getElementById('zoomSlider').value = zoomLevel;
  document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';
  if (viewMode === 'grid') layoutCurrent();
}
function toggleViewMode() {
  viewMode = viewMode === 'grid' ? 'carousel' : 'grid';
  document.getElementById('viewToggleBtn').innerHTML = viewMode === 'grid' ? '&#9776; Carousel' : '&#8862; Grid';
  document.getElementById('zoomControl').style.display = viewMode === 'grid' ? 'flex' : 'none';
  layoutCurrent();
  renderPrompt();
}
document.getElementById('viewToggleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleViewMode();
});
document.getElementById('zoomSlider').addEventListener('input', (e) => setZoom(parseFloat(e.target.value)));
document.getElementById('scene').addEventListener('wheel', (e) => {
  if (viewMode !== 'grid') return;
  e.preventDefault();
  setZoom(zoomLevel + (e.deltaY < 0 ? 0.1 : -0.1));
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') moveLeft();
  else if (e.key === 'ArrowRight') moveRight();
  else if (e.key === 'ArrowUp') moveUp();
  else if (e.key === 'ArrowDown') moveDown();
  else if (e.key === 'Enter') activate();
  else if (e.key === 'Delete') removeCurrent();
  else if (e.key === 'Escape') goBack();
  else if (e.key.toLowerCase() === 'g') toggleViewMode();
  else if (e.key === '-' || e.key === '_') setZoom(zoomLevel - 0.1);
  else if (e.key === '=' || e.key === '+') setZoom(zoomLevel + 0.1);
});

// Raycasting click-to-select in grid mode (clicking a tile selects it;
// clicking the already-selected tile installs it) -- the carousel keeps its
// simpler left/middle/right screen-zone clicks since only one row is visible.
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function pickTileIndexAt(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(tiles.map((t) => t.mesh));
  if (!hits.length) return -1;
  return tiles.findIndex((t) => t.mesh === hits[0].object);
}

document.getElementById('scene').addEventListener('click', (e) => {
  if (viewMode === 'grid') {
    const idx = pickTileIndexAt(e.clientX, e.clientY);
    if (idx === -1) return;
    if (idx === currentIndex) activate();
    else { currentIndex = idx; layoutCurrent(); updateInfo(); }
    return;
  }
  const x = e.clientX / window.innerWidth;
  if (x < 0.33) moveLeft();
  else if (x > 0.66) moveRight();
  else activate();
});

// ---- Controller support + live keyboard/gamepad prompt switching ----
const input = new InputManager();
window.__input = input; // debug/verification handle only, see web/boot.html's __bootDebug
input.onLeft(moveLeft);
input.onRight(moveRight);
input.onUp(moveUp);
input.onDown(moveDown);
input.onConfirm(activate);
input.onBack(goBack);
input.onButton(3, toggleViewMode); // Y
input.onShoulderL(() => setZoom(zoomLevel - 0.1)); // LB
input.onShoulderR(() => setZoom(zoomLevel + 0.1)); // RB

function renderPrompt() {
  const install = document.getElementById('promptInstall');
  const back = document.getElementById('promptBack');
  const nav = document.getElementById('promptNavigate');
  const remove = document.getElementById('promptRemove');
  const backBtn = document.getElementById('backBtn');
  const keycapsKeyboard = viewMode === 'grid'
    ? '<span class="key-cap">&#9650;</span><span class="key-cap">&#9660;</span><span class="key-cap">&#9668;</span><span class="key-cap">&#9658;</span>'
    : '<span class="key-cap">&#9668;</span><span class="key-cap">&#9658;</span>';
  const dpad = '<span class="dpad-icon"><span class="bar h"></span><span class="bar v"></span></span>';
  if (input.mode === 'gamepad') {
    install.innerHTML = '<span class="xb-btn xb-a">A</span> Install';
    back.innerHTML = '<span class="xb-btn xb-b">B</span> Menu';
    nav.innerHTML = dpad + ' Browse&nbsp;&nbsp;&nbsp;<span class="xb-btn xb-y">Y</span> Grid';
    remove.innerHTML = '';
    backBtn.innerHTML = '<span class="xb-btn xb-b">B</span> Back';
  } else {
    // Keyboard mode must only ever show keyboard-key icons, never a PS2/Xbox
    // controller glyph -- this replaced the old hardcoded ✕/○ PlayStation
    // button symbols that used to leak through here regardless of mode.
    install.innerHTML = '<span class="key-cap">&#9166;</span> Install';
    back.innerHTML = '<span class="key-cap">Esc</span> Menu';
    nav.innerHTML = keycapsKeyboard + ' Browse&nbsp;&nbsp;&nbsp;<span class="key-cap">G</span> Grid';
    remove.innerHTML = '<span class="key-cap">Del</span> Remove';
    backBtn.innerHTML = '<span class="key-cap">Esc</span> Back';
  }
}
input.onModeChange(renderPrompt);
renderPrompt();

// ---- Python -> JS data entry points ----
// Called from Python via page().runJavaScript() with a literal JS array
// expression (not a JSON string) -- no parsing needed here.
window.setGames = function(newGames) {
  games = newGames;
  if (currentIndex >= games.length) currentIndex = Math.max(0, games.length - 1);
  buildTiles();
};
window.updateGameStatus = function(serial, cheatsInstalled, texturesInstalled) {
  const g = games.find((game) => game.serial === serial);
  if (g) {
    g.cheatsInstalled = cheatsInstalled;
    g.texturesInstalled = texturesInstalled;
    if (games[currentIndex] && games[currentIndex].serial === serial) updateInfo();
  }
};
window.updateGameCover = function(serial, coverSource) {
  const idx = games.findIndex((game) => game.serial === serial);
  if (idx < 0) return;
  games[idx].coverSource = coverSource;
  const entry = tiles[idx];
  if (entry) {
    textureLoader.load(coverSource, (tex) => { entry.mesh.material.map = tex; entry.mesh.material.needsUpdate = true; });
  }
};
window.selectGameSerial = function(serial) {
  const idx = games.findIndex((game) => game.serial === serial);
  if (idx >= 0) { currentIndex = idx; layoutCurrent(); updateInfo(); }
};

function animate(ts) {
  requestAnimationFrame(animate);
  const t = (ts || 0) / 1000;
  tiles.forEach(({ mesh, shadow, bobPhase }) => {
    // Gentle floating bob like the Browser's hovering save icons -- the
    // shadow stays put and fades as its tile rises, selling the hover.
    const bob = Math.sin(t * 1.3 + bobPhase) * (viewMode === 'grid' ? 2.5 : 5);
    mesh.position.x += (mesh.userData.targetX - mesh.position.x) * 0.18;
    mesh.position.z += (mesh.userData.targetZ - mesh.position.z) * 0.18;
    mesh.position.y += (mesh.userData.targetY + bob - mesh.position.y) * 0.18;
    const s = mesh.scale.x + (mesh.userData.targetScale - mesh.scale.x) * 0.18;
    mesh.scale.set(s, s, s);
    mesh.rotation.y += (mesh.userData.targetRotY - mesh.rotation.y) * 0.18;
    mesh.material.opacity += (mesh.userData.targetOpacity - mesh.material.opacity) * 0.18;
    shadow.position.x = mesh.position.x;
    shadow.position.z = mesh.position.z;
    shadow.position.y = mesh.position.y + mesh.userData.shadowOffsetY;
    shadow.material.opacity = (0.55 - bob * 0.03) * mesh.material.opacity;
    const shScale = 130 * s;
    shadow.scale.set(shScale, shScale * 0.26, 1);
  });
  renderer.render(scene, camera);
}
animate();

document.getElementById('empty').style.display = 'block';
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
